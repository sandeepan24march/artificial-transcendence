
name: Daily Intelligence Briefing

on:
  push:
    branches:
      - github-briefing-v1
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: read

jobs:
  verify-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify briefing data file
        run: |
          test -f data/briefing.json
          python -m json.tool data/briefing.json > /dev/null
          echo "Briefing JSON file exists and is valid."

      - name: Report successful workflow test
        run: echo "GitHub Actions workflow ran successfully."
